openapi: 3.0.0
info:
  title: WasaText
  description: |
    This API allows users to interact with each other 
    on the WasaText app.
    Users can create groups, private chats, send text or image messages, 
    reply, forward or react them.
  version: 1.0.0
servers:
  - url: http://localhost:3000/v1
    description: Production server
tags:
  - name: Auth
  - name: Users
  - name: Conversations
  - name: Messages
  - name: Groups
    description: Endpoints related to authentication and user creation

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: UUID
      description: |
        Use the user identifier returned by `/login` in the Authorization header.
        Example: `Authorization: Bearer abcdef012345`
  responses:
    UnauthorizedError:
      description: Missing or invalid Authorization header
      content:
        application/json:
          schema:
            description: Unauthorized Error. Each request that requires authorization and fails to validate the user, will throw this error.
            type: object
            properties:
              message:
                description: The error message
                type: string
                example: "Unauthorized"
  schemas:
    Message:
      description: A message object belonging to a conversation
      type: object
      properties:
        messageId:
          type: integer
          description: The message id
        type:
          type: string
          enum: [text, image]
          description: The message type 'text' | 'image'
        isForwarded:
          type: boolean
          description: Whether the message was forwarded
        content:
          type: string
          description: The message text content (for type text) or photo path (for type image)
        authorId:
          type: integer
          description: The message author id
        createdAt:
          type: string
          format: date-time
          description: The message datetime of creation
        messageStatus:
          type: object
          description: The message status 'received' | 'read' with the id of the members who read it
          properties:
            status:
              type: string
              enum: [received, read]
              description: The status of the message
            members:
              minItems: 0
              maxItems: 1000
              type: array
              description: Member ids that read the message
              items:
                type: integer
        comments:
          minItems: 0
          maxItems: 1000
          type: array
          description: List of emoji reactions to this message
          items:
            type: object
            properties:
              emoji:
                type: string
                description: The emoji reaction
              userId:
                type: integer
                description: The user who reacted
              createdAt:
                type: string
                format: date-time
                description: The date of comment creation

    Conversation:
      description: A conversation object, either private or a group.
      type: object
      properties:
        conversationId:
          type: integer
          description: The conversation id
        type:
          type: string
          enum: [private, group]
          description: The conversation type 'private' | 'group'
        name:
          type: string
          description: The conversation name (only for groups)
        photoPath:
          type: string
          description: The conversation photo path (only for groups)
        createdBy:
          type: integer
          description: The user id of the conversation creator
        createdAt:
          type: string
          format: date-time
          description: The date of conversation creation
        members:
          minItems: 0
          maxItems: 1000
          type: array
          description: List of user ids that are members of the conversation
          items:
            type: integer
        messages:
          minItems: 0
          maxItems: 1000
          type: array
          description: Messages belonging to the conversation
          items:
            $ref: "#/components/schemas/Message"
      required:
        - conversationId
        - type
        - createdBy
        - createdAt
      example:
        conversationId: 18
        type: private
        createdBy: 31
        createdAt: "2025-10-12T15:42:00Z"
        members: [1, 2, 3]
        messages: []

    Username:
      description: The unique username chosen by the user.
      type: string
      example: alemilos
      pattern: "^[a-zA-Z0-9_]*[a-zA-Z][a-zA-Z0-9_]*$"
      minLength: 3
      maxLength: 16
    ImageUpload:
      description: Image upload input validation. The image size can be at most 2MB and the allowed types are jpeg, png and webp.
      type: object
      properties:
        file:
          type: string
          format: binary
          minLength: 0
          maxLength: 2000000
          description: >
            Image file to upload. Allowed types: jpeg, png, webp.
            Max size: 2MB.
      required:
        - file
    ErrorMessage:
      description: An error message thrown on the response
      type: object
      properties:
        message:
          type: string
          description: Error message
          example: "User not found"
    SuccessMessage:
      description: A success message provided in the response
      type: object
      properties:
        message:
          type: string
          description: Success message
          example: "Operation completed successfully"

security:
  - BearerAuth: []

paths:
  /login:
    post:
      tags:
        - Auth
      summary: Log in the user
      description: |-
        If the user does not exist, it will be created,
        and an identifier is returned.
        If the user exists, the user identifier is returned.
      operationId: doLogin
      security: [] # Override the security header
      requestBody:
        description: User details
        content:
          application/json:
            schema:
              description: The username chosen by the user
              type: object
              properties:
                username:
                  $ref: "#/components/schemas/Username"
        required: true
      responses:
        "200":
          description: Existing user logged in successfully
          content:
            application/json:
              schema:
                description: The user data of the logged in user
                type: object
                properties:
                  id:
                    type: integer
                    example: 5
                    description: the user id
                  username:
                    $ref: "#/components/schemas/Username"
                  photoPath:
                    type: string
                    example: profiles/10.png
                    description: the profile photo path
              example:
                id: 10
                username: "alemilos"
                photoPath: "profiles/10.png"
        "201":
          description: New user created and logged in successfully
          content:
            application/json:
              schema:
                description: The user data of the registered user
                type: object
                properties:
                  id:
                    type: integer
                    example: 5
                    description: the user id
                  username:
                    $ref: "#/components/schemas/Username"
              example:
                id: 6
                username: "newuser"
  /me/username:
    put:
      tags:
        - Users
      summary: Set username for a user
      description:
        Change the username for a user. The username must be a string of minimum
        length 3 and maximum length 16 and contain only alphabet characters, numbers and underscores.
      operationId: setMyUserName
      requestBody:
        description: Update username if it doesn't already exist
        content:
          application/json:
            schema:
              description: The new username chosen by the user
              type: object
              properties:
                username:
                  $ref: "#/components/schemas/Username"
        required: true
      responses:
        "200":
          description: Username successfully updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessMessage"
              example:
                message: "Username successfully updated"

        "400":
          description: Invalid username
          content:
            application/json:
              schema:
                description: A descriptive message of invalid username
                type: object
                properties:
                  message:
                    type: string
                    example: "The username must be between 3 and 16 characters and contain only alphanumeric characters or underscores"
                    description: The failure message
        "409":
          description: Username already exists
          content:
            application/json:
              schema:
                description: A descriptive message for already taken username
                type: object
                properties:
                  message:
                    type: string
                    example: This username is already taken
                    description: The failure message
        "401":
          $ref: "#/components/responses/UnauthorizedError"

  /me/photo:
    post:
      tags:
        - Users
      summary: Upload a profile image
      description:
        Upload a user's profile image. The image must be of jpeg, png or webp format and its size
        must be at most 2Mb.
      operationId: setMyPhoto
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/ImageUpload"
            encoding:
              file:
                contentType: image/jpeg, image/png, image/webp
      responses:
        "200":
          description: Profile photo uploaded successfully
          content:
            application/json:
              schema:
                description: A descriptive message of success and the new image url
                type: object
                properties:
                  message:
                    type: string
                    example: "Profile photo updated"
                    description: The success message
                  photoPath:
                    type: string
                    example: profiles/1.png
                    description: The newly profile photo path
              example:
                message: "Profile photo updated"
                photoPath: "profiles/1.png"
        "400":
          description: Invalid input image
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
              example:
                message: "Wrong File Format"
        "401":
          $ref: "#/components/responses/UnauthorizedError"

  /conversations:
    post:
      tags:
        - Conversations
      summary: Create a new conversation
      description: |
        Create a new private conversation.  
        If a private conversation with the specified user already exists, the existing one is returned.
      operationId: createConversation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              description: The recipient id to start the conversation with
              oneOf:
                - type: object
                  required:
                    - recipientId
                  properties:
                    recipientId:
                      type: integer
                      description: The ID of the recipient user.
              example:
                recipientId: 23
      responses:
        "201":
          description: Conversation created successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Conversation"
              example:
                conversationId: 18
                type: private
                createdBy: 31
                createdAt: "2025-10-12T15:42:00Z"
        "200":
          description: Existing conversation returned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Conversation"
              example:
                conversationId: 7
                type: private
                createdBy: 31
                createdAt: "2025-09-25T09:20:00Z"
        "400":
          description: Invalid request body
          content:
            application/json:
              schema:
                description: A descriptive message of failure
                type: object
                properties:
                  message:
                    type: string
                    example: "Missing recipient id"
                    description: The message of failure
        "404":
          description: Recipient not found
          content:
            application/json:
              schema:
                description: A descriptive message of failure
                type: object
                properties:
                  message:
                    type: string
                    example: "User not found"
                    description: The message of failure
        "401":
          $ref: "#/components/responses/UnauthorizedError"
    get:
      tags:
        - Conversations
      summary: Get a user's conversations
      description:
        Get all user's conversations. Each conversation entry will contain the conversation fields and
        if present, a lastMessage entry acting as a preview for the conversation.
      operationId: getMyConversations
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                description: An object containing the array of conversations for the user
                type: object
                properties:
                  conversations:
                    description: The conversations array
                    type: array
                    minItems: 0
                    maxItems: 1000
                    items:
                      type: object
                      properties:
                        conversationId:
                          type: integer
                          description: The conversation id
                        type:
                          type: string
                          enum: [private, group]
                          description: The conversation type 'private' | 'group'
                        name:
                          type: string
                          description: The conversation name (if the conversation is a group)
                        photoPath:
                          type: string
                          description: The conversation photo path (if the conversation is a group)
                        createdBy:
                          type: integer
                          description: The conversation creator's user id
                        createdAt:
                          type: string
                          format: date-time
                          description: The conversation datetime of creation
                        lastMessage:
                          type: object
                          description: The last message sent in the conversation
                          properties:
                            id:
                              type: integer
                              description: The message id
                            type:
                              type: string
                              enum: [text, image]
                              description: The message type 'text' | 'image'
                            isForwarded:
                              type: boolean
                              description: Whether the message was forwarded
                            authorId:
                              type: integer
                              description: The user id that created the message
                            content:
                              type: string
                              description: The message text content (for type text) or photo path (for type image)
                            createdAt:
                              type: string
                              format: date-time
                              description: The message datetime of creation
              example:
                conversations:
                  - conversationId: 7
                    type: group
                    name: Partite Calcio
                    photoPath: "groups/7.png"
                    createdBy: 31
                    createdAt: "2025-09-29T14:48:00Z"
                    lastMessage:
                      id: 239
                      type: text
                      isForwarded: false
                      authorId: 20
                      content: "Va bene ci sono per stasera, ci vediamo!"
                      createdAt: "2025-09-28T16:30:00Z"
                  - conversationId: 12
                    type: private
                    name: "Edoardo"
                    photoPath: "profiles/4.webp"
                    createdBy: 31
                    createdAt: "2025-09-25T09:20:00Z"
                    lastMessage:
                      id: 312
                      type: text
                      isForwarded: false
                      authorId: 45
                      content: "Ci sentiamo più tardi!"
                      createdAt: "2025-09-28T18:10:00Z"

        "401":
          $ref: "#/components/responses/UnauthorizedError"

  /conversations/{id}:
    get:
      tags:
        - Conversations
      summary: Get a conversation by id
      description:
        Get a conversation with all the messages belonging to it. The conversation can either be a
        private chat or a group chat. Each message entry will contain the message fields and
        the message status fields.
      operationId: getConversation
      parameters:
        - name: id
          in: path
          required: true
          description: The conversation id
          schema:
            type: integer
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Conversation"
              example:
                conversationId: 23
                type: "group"
                createdBy: 2
                createdAt: "2025-07-29T14:48:00Z"
                messages:
                  - messageId: 65
                    type: image
                    isForwarded: true
                    content: "groups/7/images/photo123.jpeg"
                    authorId: 3
                    createdAt: "2025-09-29T14:48:00Z"
                    messageStatus:
                      status: read
                      members: [1, 2, 3]
                    comments:
                      - authorId: 1
                        emoji: "🔥"
                        createdAt: "2025-09-29T14:48:32Z"
                      - authorId: 2
                        emoji: "😂"
                        createdAt: "2025-09-29T14:49:00Z"
                  - messageId: 66
                    type: text
                    isForwarded: false
                    content: "AHHAAHH che ridere!"
                    authorId: 1
                    createdAt: "2025-09-29T15:00:00Z"
                    messageStatus:
                      status: received
                      members: [1, 3]
                    comments: []
                  - messageId: 67
                    type: text
                    isForwarded: false
                    content: "No vabbe troppo divertente"
                    authorId: 2
                    createdAt: "2025-09-29T15:05:00Z"
                    messageStatus:
                      status: received
                      members: [3]
                    comments: []
        "401":
          $ref: "#/components/responses/UnauthorizedError"

        "403":
          description: The user doesn't belong to the conversation
          content:
            application/json:
              schema:
                description: A descriptive messafe of failure
                type: "object"
                properties:
                  message:
                    type: string
                    description: The user doesn't belong to this conversation.
              example:
                message: User doesn't belong to the conversation

  /conversations/{id}/messages:
    post:
      tags:
        - Conversations
      summary: Send a message to a conversation
      description: Send a new message to the specified conversation.
      operationId: sendMessage
      parameters:
        - name: id
          in: path
          required: true
          description: The conversation id
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              description: Properties to send a new message in the conversation
              type: object
              required:
                - type
                - content
              properties:
                type:
                  type: string
                  enum: [text]
                  description: the message type 'text'
                content:
                  type: string
                  description: Text content of the message
                  minLength: 0
                  maxLength: 1000000
                  pattern: "^.{1,1000000}$"
            example:
              type: text
              content: "Hello, how are you?"
          multipart/form-data:
            schema:
              description: Properties to send a new message in the conversation
              type: object
              required:
                - type
                - file
              properties:
                type:
                  type: string
                  enum: [image]
                  description: the message type 'image'
                file:
                  type: string
                  format: binary
                  minLength: 0
                  maxLength: 2000000
                  description: >
                    Image file to send. Allowed types: jpeg, png, webp.
                    Max size: 2MB.
            encoding:
              file:
                contentType: image/jpeg, image/png, image/webp
      responses:
        "200":
          description: Message sent successfully
          content:
            application/json:
              schema:
                description: An object representing the newly created message
                type: object
                properties:
                  messageId:
                    type: integer
                    description: The message id
                  type:
                    type: string
                    enum: [text, image]
                    description: The message type 'text' | 'image'
                  content:
                    type: string
                    description: The message content (text if type is 'text', photo path if type is 'image')
                  createdAt:
                    type: string
                    format: date-time
                    description: The datetime of message creation
              example:
                messageId: 101
                type: text
                content: "Ciao Caro"
                createdAt: "2025-10-17T18:30:00Z"
        "400":
          description: Invalid input image
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
              example:
                message: "Wrong File Format"
        "403":
          description: The user doesn't belong to the conversation
          content:
            application/json:
              schema:
                description: A descriptive message of failure
                type: "object"
                properties:
                  message:
                    type: string
                    description: The user doesn't belong to this conversation.
              example:
                message: User doesn't belong to the conversation
        "401":
          $ref: "#/components/responses/UnauthorizedError"

  /conversations/{id}/read:
    post:
      summary: Mark messages as read in a conversation
      description: |
        Marks one or more messages as read for the authenticated user.  
        The user must belong to the specified conversation.
      operationId: readMessages
      tags:
        - Conversations
      parameters:
        - name: id
          in: path
          required: true
          description: ID of the conversation
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              description: An object with an array of messages id that will be marked as read
              type: object
              required:
                - messages
              properties:
                messages:
                  description: Array of message ids
                  type: array
                  minItems: 0
                  maxItems: 10000
                  items:
                    type: integer
                    format: int64
                  example: [12, 13, 14]
      responses:
        "204":
          description: Messages successfully marked as read (no content)

        "400":
          description: Invalid request (e.g., missing message IDs or invalid JSON)
          content:
            application/json:
              schema:
                description: A descritive message of failure
                type: "object"
                properties:
                  message:
                    type: string
                    description: Invalid request (e.g., missing message IDs or invalid JSON)
              example:
                message: Invalid request (e.g., missing message IDs or invalid JSON)

        "403":
          description: User does not belong to the conversation
          content:
            application/json:
              schema:
                description: A descritive message of failure
                type: "object"
                properties:
                  message:
                    type: string
                    description: The user doesn't belong to this conversation.
              example:
                message: User doesn't belong to the conversation

        "401":
          $ref: "#/components/responses/UnauthorizedError"

  /messages/{id}/forward:
    post:
      tags:
        - Messages
      summary: Forward a message to a conversation
      description: Forward a message to another conversation
      operationId: forwardMessage
      parameters:
        - name: id
          in: path
          required: true
          description: The message id
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              description: The conversation id to forward the message to
              type: object
              required:
                - conversationId
              properties:
                conversationId:
                  type: integer
                  description: the conversation id
            example:
              conversationId: 38

      responses:
        "200":
          description: Message forwarded successfully
          content:
            application/json:
              schema:
                description: A descriptive message of success
                type: object
                properties:
                  message:
                    type: string
                    description: the success message
              example:
                message: Message forwarded successfully
        "404":
          description: Invalid conversation
          content:
            application/json:
              schema:
                description: A descritive message of failure
                type: "object"
                properties:
                  message:
                    type: string
                    description: Conversation not found.
              example:
                message: Conversation not found.

        "401":
          $ref: "#/components/responses/UnauthorizedError"

  /messages/{id}/comment:
    parameters:
      - name: id
        in: path
        required: true
        description: The message id
        schema:
          type: integer
    put:
      tags:
        - Messages
      summary: React to a message
      description: React to a message with an emoji.
      operationId: commentMessage
      requestBody:
        description: React to a message with an emoji unicode
        content:
          application/json:
            schema:
              description: An emoji that matches the pattern
              type: object
              properties:
                emoji:
                  description: the emoji string (simplified, check source code for more informations validation.emoji.go)
                  type: string
                  example: ❤️
                  minLength: 0
                  maxLength: 20
                  pattern: '^[\u2000-\u2BFF\uE000-\uFFFF]+$'

        required: true
      responses:
        "200":
          description: Reacted to message
          content:
            application/json:
              schema:
                description: A descriptive message of success
                type: object
                properties:
                  message:
                    type: string
                    description: the message of success
                example:
                  message: Reacted to message successfully
        "400":
          description: Invalid emoji unicode
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
              example:
                message: "Invalid Emoji Unicode"
        "401":
          $ref: "#/components/responses/UnauthorizedError"

    delete:
      tags:
        - Messages
      summary: Remove message reaction
      description: Delete the emoji reaction from
      operationId: uncommentMessage
      responses:
        "200":
          description: Message reaction deleted
          content:
            application/json:
              schema:
                description: A descriptive message of success
                type: object
                properties:
                  message:
                    type: string
                    description: the message of success
              example:
                message: Message reaction deleted successfully
        "404":
          description: Invalid reaction id
          content:
            application/json:
              schema:
                description: A descriptive message of failure
                type: "object"
                properties:
                  message:
                    type: string
                    description: Reaction not found.
              example:
                message: Reaction not found.

        "401":
          $ref: "#/components/responses/UnauthorizedError"

  /messages/{id}:
    delete:
      tags:
        - Messages
      summary: Delete a message
      description: Delete a message if it wasn't created more than 30 minutes ago.
      operationId: deleteMessage
      parameters:
        - name: id
          in: path
          required: true
          description: The message id
          schema:
            type: integer
      responses:
        "200":
          description: Message deleted
          content:
            application/json:
              schema:
                description: A descriptive message of success
                type: object
                properties:
                  message:
                    type: string
                    description: the message of success
                example:
                  message: Message deleted successfully
        "404":
          description: Message not found
          content:
            application/json:
              schema:
                description: A descriptive message of failure
                type: object
                properties:
                  message:
                    type: string
                    description: the message of failure
                example:
                  message: Message not found
        "403":
          description: Message was created more than 30 minutes ago
          content:
            application/json:
              schema:
                description: A descriptive message of failure
                type: object
                properties:
                  message:
                    type: string
                    description: the message of failure
                example:
                  message: Cannot delete messages older than 30 minutes
        "401":
          $ref: "#/components/responses/UnauthorizedError"

  /groups/{id}/members:
    parameters:
      - name: id
        in: path
        required: true
        description: The group id
        schema:
          type: integer
    post:
      tags:
        - Groups
      summary: Add a new member to a group
      description: Any user belonging to a group can add other users to the group if they are not already there.
      operationId: addToGroup
      requestBody:
        required: true
        content:
          application/json:
            schema:
              description: The username of the member to add
              type: object
              required:
                - userId
              properties:
                userId:
                  type: integer
                  description: user id
      responses:
        "200":
          description: Member added to the group successfully.
          content:
            application/json:
              schema:
                type: object
                description: A descriptive message of success
                properties:
